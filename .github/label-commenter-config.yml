comment:
  # header: "Please note the following requirement:"
  footer: "\
    ---\n\n
    > &nbsp; &#9; &nbsp; &#9;  &nbsp; &#9;  &nbsp; &#9; Be sure to [join the community](https://slack.layer5.io), if you haven't yet and please leave a :star: [star on the project](https://github.com/blowhorn-ai/blowhorn-site/stargazers) :smile:
    "

labels:
  - name: issue/design required
    labeled:
      issue:
        body: This issue has been labeled with 'issue/design required'. Note that prior to commencing on implementation, a design specification needs to be created and reviewed for approval. See [Creating a Functional Specification](https://docs.google.com/document/d/1RP3IWLc-MiQS-QYasqCoVuCH7--G87p5ezE5f_nOzB8/edit?usp=sharing) to create a design spec.
        action: open
  - name: issue/remind
    labeled:
      issue:
        body: Checking in... it has been awhile since we've heard from you on this issue. Are you still working on it? Please let us know and please don't hesitate to contact a [MeshMate](https://layer5.io/community/meshmates/) or any other [community member](https://layer5.io/community/members) for assistance.
        action: open
      pr:
        body: Checking in... it has been awhile since we've heard from you on this pull request. Are you still working on it? Please let us know and please don't hesitate to contact a [MeshMate](https://layer5.io/community/meshmates/) or any other [community member](https://layer5.io/community/members) for assistance.
        action: open
  - name: issue/dco
    labeled:
      issue:
        body: "🚨 Alert! Git Police! We couldn’t help but notice that one or more of your commits is missing a sign-off. _A what?_ A commit sign-off (your email address).\n\n
          To amend the commits in this PR with your signoff using the instructions provided in the DCO check. \n\n
          To configure your dev environment to automatically signoff on your commits in the future, see [these instructions](https://github.com/blowhorn-ai/blowhorn-site/blob/master/CONTRIBUTING.md#signing-off-on-commits-developer-certificate-of-origin)."
        action: open
      pr:
        body: "🚨 Alert! Git Police! We couldn’t help but notice that one or more of your commits is missing a sign-off. _A what?_ A commit sign-off (your email address).\n\n
          To amend the commits in this PR with your signoff using the instructions provided in the DCO check. \n\n
          To configure your dev environment to automatically signoff on your commits in the future, see [these instructions](https://github.com/blowhorn-ai/blowhorn-site/blob/master/CONTRIBUTING.md#signing-off-on-commits-developer-certificate-of-origin)."
        action: open
  - name: area/ui
    labeled:
      issue:
        body: This issue has been labeled with 'area/ui'. 🎨 Please review the [Site Contribution Flow](https://github.com/blowhorn-ai/blowhorn-site/blob/master/CONTRIBUTING.md#site-contribution-flow) and [DESIGN.md](https://github.com/blowhorn-ai/blowhorn-site/blob/master/DESIGN.md), and run `make check` before opening a PR.
        action: open
      pr:
        body: This PR has been labeled with 'area/ui'. 🎨 Please ensure changes adhere to [DESIGN.md](https://github.com/blowhorn-ai/blowhorn-site/blob/master/DESIGN.md) and that `make check` passes cleanly.
        action: open
  - name: issue/welcome
    labeled:
      issue:
        body: Thanks for opening this issue. A contributor will be by to give feedback soon. In the meantime, please review the [Layer5 Contributors' Welcome Guide](https://docs.google.com/document/d/17OPtDE_rdnPQxmk2Kauhm3GwXF1R5dZ3Cj8qZLKdo5E/edit?usp=sharing) and be sure to join the [community Slack](https://slack.layer5.io/).
        action: open
      pr:
        body: >
          <p align="center">Thank you for contributing to the Layer5 community! :tada: </p>
        action: open
