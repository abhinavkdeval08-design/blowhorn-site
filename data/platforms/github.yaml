# Supported actions on GitHub. See linkedin.yaml for the shared rules.
key: github
name: GitHub
weight: 7
logo: assets/platforms/github-invertocat-black.svg
docs: /docs/reference/platforms/github/
reach: GitHub's API, never the browser
actions:
  - id: react
    behavior: Adds the five upbeat reactions (+1, laugh, hooray, heart, rocket) to an issue or pull request from each of your profiles. Running it again adds none of them twice.
    limits: GitHub doesn't publish posts; it needs an issue or pull request link.
  - id: star
    behavior: Stars each named repository from every selected profile, over the REST API. A repository already starred is counted apart, never starred twice.
    limits: GitHub only. Repositories are named on the command line; star cannot be scheduled.
  - id: follow
    behavior: Name a target account. With --limit 0, follow that account, or several comma-separated. With a positive limit, follow up to that many of the target's followers, never the target itself.
  - id: find
    behavior: Searches issues and pull requests by query, with repository, type, and state filters.
    limits: Read-only. Issues and pull requests only, not repositories or code.
